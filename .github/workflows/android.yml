name: Build Android APK
on: [push] # 코드가 업데이트될 때마다 자동으로 빌드 시작

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 소스코드 가져오기
        uses: actions/checkout@v4

      - name: Node.js 세팅
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 자바 및 안드로이드 환경 세팅
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cordova 및 빌드 도구 설치
        run: |
          npm install -g cordova
          cordova create myapp com.example.myapp MyApp
          cd myapp
          cordova platform add android
          # 원래 있던 기본 www 폴더를 지우고, 사용자의 HTML 파일을 복사
          rm -rf www
          cp -r ../* www/ || true 
          # 빌드 실행
          cordova build android --release

      - name: 완성된 APK 파일 저장 및 다운로드 제공
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: myapp/platforms/android/app/build/outputs/apk/release/*.apk
